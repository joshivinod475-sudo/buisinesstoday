name: Build and deploy

# Every push to `main` builds the site and publishes the finished files
# to the `deploy` branch. Hostinger pulls the `deploy` branch into public_html.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Publish built site to the deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: deploy
          force_orphan: true
          enable_jekyll: true # don't add a .nojekyll file; not needed on Hostinger
          commit_message: "Deploy site"

      # Optional: if you add a repo secret named HOSTINGER_WEBHOOK (the auto-deploy
      # URL from hPanel → Advanced → Git), Hostinger is told to pull right away.
      - name: Ping Hostinger
        env:
          HOOK: ${{ secrets.HOSTINGER_WEBHOOK }}
        if: ${{ env.HOOK != '' }}
        run: curl -fsS -X POST "$HOOK"
